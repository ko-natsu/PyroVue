<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>PyroVue</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app" data-run="idle" data-expanded="false">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 L21 20 H16.6 L12 11.6 L7.4 20 H3 Z" fill="currentColor" />
        </svg>
        <span class="wordmark">PYROVUE</span>
      </div>
      <div class="mast-status">
        <span class="run-id" id="runId">Run #&mdash;</span>
        <span class="run-state" id="runState" data-state="idle">IDLE</span>
        <time class="clock" id="clock">&ndash;:&ndash;&ndash;</time>
        <button class="btn btn-ghost btn-compact" id="themeBtn" type="button" aria-label="Toggle light or dark theme">&#9790;</button>
      </div>
    </header>
    <div class="heat-dither heat-dither-top" aria-hidden="true"></div>
    <div class="heat-dither heat-dither-edge" aria-hidden="true"></div>

    <main class="stage">
      <section class="readout" aria-label="Current reading">
        <div class="temperature"><span id="bigTemp">&mdash;</span><span class="temp-unit" id="tempUnit">&deg;C</span></div>

        <p class="rate" id="rateLine" hidden></p>

        <div class="status-lines">
          <p class="status-line" id="connLine" aria-live="polite">Connecting&hellip;</p>
          <p class="status-line" id="freshLine" aria-live="polite">Waiting for data&hellip;</p>
          <p class="status-line status-fault" id="faultLine" aria-live="assertive" hidden></p>
        </div>

      </section>

      <section class="graph-panel" aria-label="Temperature history">
        <div class="graph-frame">
          <canvas id="chart" role="img" aria-label="Full firing temperature history; touch or drag to inspect points">Temperature history graph</canvas>
        </div>

        <div class="graph-toolbar">
          <p class="inspect-line" id="inspectLine" hidden aria-live="polite"></p>
          <button class="btn btn-ghost btn-compact" id="markersToggle" type="button" aria-expanded="false" aria-controls="markersPanel" hidden>Markers (0)</button>
          <button class="btn btn-ghost btn-compact" id="expandBtn" type="button" aria-pressed="false" aria-controls="chart">Expand</button>
        </div>
        <section class="markers-panel" id="markersPanel" aria-label="Run markers" hidden>
          <div class="markers-heading"><strong>Run markers</strong><button class="btn btn-ghost btn-compact" id="markersClose" type="button" aria-label="Close markers">Close</button></div>
          <div class="markers-list" id="markersList"></div>
          <form class="marker-editor" id="markerEditor" hidden>
            <label for="markerNote" id="markerTime">Marker note</label>
            <textarea id="markerNote" rows="2" maxlength="500" placeholder="Optional note"></textarea>
            <div class="marker-actions">
              <button class="btn" type="submit">Save note</button>
              <button class="btn btn-ghost" id="markerDelete" type="button">Delete marker</button>
            </div>
          </form>
        </section>
        <div class="session-row">
          <div class="timing">
            <span class="elapsed" id="elapsed">T+--:--:--</span>
            <span class="started" id="started">Started &mdash;</span>
          </div>
          <div class="controls">
            <button class="btn btn-primary" id="sessionBtn" type="button">Start Session</button>
            <button class="btn" id="markerBtn" type="button" disabled title="Start a session to add markers">+ Add Marker</button>
            <button class="btn btn-ghost btn-compact" id="unitBtn" type="button" aria-label="Toggle &deg;C or &deg;F">&deg;C</button>
          </div>
        </div>
      </section>
      <aside class="cone-panel" id="coneWidget" data-model="unavailable" aria-label="Estimated cone unavailable">
        <div class="cone-heading">Estimated cone</div>
        <div class="cone-instrument">
          <svg class="cone-glyph" viewBox="0 0 96 72" aria-hidden="true">
            <path class="cone-trail" d="M16 64 Q26 48 36 8 Q42 44 56 64 Z" />
            <path class="cone-trail" d="M16 64 Q44 36 78 52 Q64 44 56 64 Z" />
            <path class="cone-shape" id="coneShape" d="M16 64 Q26 48 36 8 Q42 44 56 64 Z" />
            <path class="cone-baseline" d="M8 66 H86" />
          </svg>
          <div class="cone-reading">
            <strong class="cone-label" id="coneLabel">Estimated cone —</strong>
            <div class="cone-nearby" aria-hidden="true">
              <span id="conePrevious"></span>
              <span id="coneCurrent"></span>
              <span id="coneNext"></span>
            </div>
          </div>
        </div>
        <p class="cone-basis" id="coneBasis">Awaiting sufficient valid firing history</p>
        <p class="cone-disclaimer">Estimate · verify with witness cones.</p>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="./js/protocol.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/transport.js"></script>
  <script src="./js/metrics.js"></script>
  <script src="./js/cones.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/markers.js"></script>
  <script src="./js/graph.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
