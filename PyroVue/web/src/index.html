<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>PyroVue</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app" data-run="idle" data-expanded="false">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 L21 20 H16.6 L12 11.6 L7.4 20 H3 Z" fill="currentColor" />
        </svg>
        <span class="wordmark">PYROVUE</span>
      </div>
      <div class="mast-status">
        <span class="run-id" id="runId">Run #&mdash;</span>
        <span class="run-state" id="runState" data-state="idle">IDLE</span>
        <time class="clock" id="clock">&ndash;:&ndash;&ndash;</time>
        <button class="btn btn-ghost btn-compact" id="themeBtn" type="button" aria-label="Toggle light or dark theme">&#9790;</button>
      </div>
    </header>

    <main class="stage">
      <section class="readout" aria-label="Current reading">
        <div class="temperature"><span id="bigTemp">&mdash;</span><span class="temp-unit" id="tempUnit">&deg;C</span></div>

        <p class="rate" id="rateLine" hidden></p>

        <div class="status-lines">
          <p class="status-line" id="connLine" aria-live="polite">Connecting&hellip;</p>
          <p class="status-line" id="freshLine" aria-live="polite">Waiting for data&hellip;</p>
          <p class="status-line status-fault" id="faultLine" aria-live="assertive" hidden></p>
        </div>

        <div class="cone" id="coneWidget" data-model="placeholder" aria-label="Cone progression">
          <svg class="cone-glyph" viewBox="0 0 64 48" aria-hidden="true">
            <path d="M14 44 L30 10 L32 6 L34 10 L50 44" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" />
            <path d="M21 44 L32 17 L43 44" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4" />
          </svg>
          <span class="cone-label" id="coneLabel">Cone &mdash;</span>
        </div>
      </section>

      <section class="graph-panel" aria-label="Temperature history">
        <div class="graph-frame">
          <canvas id="chart" role="img" aria-label="Full firing temperature history; touch or drag to inspect points">Temperature history graph</canvas>
        </div>

        <div class="graph-toolbar">
          <p class="inspect-line" id="inspectLine" hidden aria-live="polite"></p>
          <button class="btn btn-ghost btn-compact" id="expandBtn" type="button" aria-pressed="false" aria-controls="chart">Expand</button>
        </div>

        <div class="session-row">
          <div class="timing">
            <span class="elapsed" id="elapsed">T+--:--:--</span>
            <span class="started" id="started">Started &mdash;</span>
          </div>
          <div class="controls">
            <button class="btn btn-primary" id="sessionBtn" type="button">Start Session</button>
            <button class="btn" id="markerBtn" type="button" title="Event markers arrive in a later update">+ Add Marker</button>
            <button class="btn btn-ghost btn-compact" id="unitBtn" type="button" aria-label="Toggle &deg;C or &deg;F">&deg;C</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="./js/protocol.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/transport.js"></script>
  <script src="./js/metrics.js"></script>
  <script src="./js/graph.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
