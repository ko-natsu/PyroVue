[platformio]
default_envs = adafruit_feather_esp32s3_tft

[env]
monitor_speed = 115200
build_flags = -I include
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit MAX31855 library
    bblanchon/ArduinoJson
    ESP32Async/ESPAsyncWebServer@^3.6.0

[env:adafruit_feather_esp32s3_tft]
platform = espressif32
board = adafruit_feather_esp32s3_tft
framework = arduino
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP@^3.3.2
build_flags =
    ${env.build_flags}
    -D PYROVUE_HAS_DISPLAY=1

[env:esp8266_d1mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_ignore = DisplayManager, StatusManager
lib_deps =
    adafruit/Adafruit MAX31855 library
    bblanchon/ArduinoJson
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/ESPAsyncTCP@^2.0.0
build_flags =
    ${env.build_flags}
    -D PYROVUE_NO_DISPLAY=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
build_flags =
    ${env.build_flags}
    -std=c++17
    -D PYROVUE_NATIVE=1
