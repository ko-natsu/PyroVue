[platformio]
default_envs = adafruit_feather_esp32s3_tft
data_dir = data

[env]
monitor_speed = 115200
build_flags = -I include
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit MAX31855 library
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1

[env:adafruit_feather_esp32s3_tft]
platform = espressif32
board = adafruit_feather_esp32s3_tft
framework = arduino
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP@3.5.0
build_flags =
    ${env.build_flags}
    -D PYROVUE_HAS_DISPLAY=1
    -D PYROVUE_SINGLE_RUN_CSV=1

[env:esp8266_d1mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_ignore = DisplayManager, StatusManager
lib_deps =
    adafruit/Adafruit MAX31855 library
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/ESPAsyncTCP@2.0.0
build_flags =
    ${env.build_flags}
    -D PYROVUE_NO_DISPLAY=1

[env:esp32s3_devkitc_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.filesystem = littlefs
board_build.partitions = partitions/n16r8.csv
lib_ignore = DisplayManager, StatusManager, Adafruit GFX Library, Adafruit ST7735 and ST7789 Library
lib_deps =
    adafruit/Adafruit MAX31855 library
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D PYROVUE_BOARD_N16R8=1
    -D PYROVUE_RUN_ARCHIVE=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
lib_deps =
    throwtheswitch/Unity@^2.6.1
    bblanchon/ArduinoJson@7.4.3
build_flags =
    ${env.build_flags}
    -std=c++17
    -D PYROVUE_NATIVE=1
